<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Hearthold app icon: the keep on its hill, in the game's ink-outlined cartoon style. -->
  <defs>
    <radialGradient id="glow" cx="512" cy="430" r="470" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffe7a0" stop-opacity="1" />
      <stop offset="0.38" stop-color="#ffc24e" stop-opacity="0.85" />
      <stop offset="0.75" stop-color="#e8922f" stop-opacity="0.18" />
      <stop offset="1" stop-color="#e8922f" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#28503a" />
      <stop offset="1" stop-color="#173022" />
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6cc053" />
      <stop offset="1" stop-color="#3f8a3a" />
    </linearGradient>
  </defs>
  <g id="sky">
    <rect width="1024" height="1024" fill="url(#bg)" />
    <circle cx="512" cy="430" r="470" fill="url(#glow)" />
  </g>
  <g id="keep" stroke="#1c140e" stroke-width="16" stroke-linejoin="round" stroke-linecap="round">
    <!-- flag -->
    <line x1="512" y1="272" x2="512" y2="118" />
    <path d="M520 126 L718 156 L668 186 L718 216 L520 238 Z" fill="#d8342b" />
    <path d="M520 150 L640 166" stroke="#f27a5e" stroke-width="10" fill="none" />
    <!-- side walls -->
    <path d="M150 612 h40 v-44 h46 v44 h46 v-44 h46 v44 h52 V812 H150 Z" fill="#d9c7a2" />
    <path d="M874 612 h-40 v-44 h-46 v44 h-46 v-44 h-46 v44 h-52 V812 H874 Z" fill="#cdb98f" />
    <!-- tower -->
    <path d="M352 330 V270 h62 v60 h24 v-60 h62 v60 h24 v-60 h62 v60 h24 v-60 h62 V812 H352 Z" fill="#ead9b2" />
    <path d="M610 342 h54 V804 h-54 Z" fill="#cdb98f" stroke="none" />
    <path d="M352 330 H672" fill="none" />
    <!-- stones -->
    <g stroke="#b9a37c" stroke-width="10">
      <line x1="384" y1="560" x2="440" y2="560" />
      <line x1="590" y1="600" x2="640" y2="600" />
      <line x1="400" y1="720" x2="446" y2="720" />
      <line x1="200" y1="680" x2="252" y2="680" />
      <line x1="780" y1="700" x2="830" y2="700" />
      <line x1="576" y1="388" x2="626" y2="388" />
    </g>
    <!-- windows, lit -->
    <path d="M414 500 v-52 a24 24 0 0 1 48 0 v52 Z" fill="#ffd45a" />
    <path d="M562 500 v-52 a24 24 0 0 1 48 0 v52 Z" fill="#ffd45a" />
    <!-- door -->
    <path d="M444 812 V700 a68 68 0 0 1 136 0 V812 Z" fill="#8a5428" />
    <g stroke="#5e3718" stroke-width="10">
      <line x1="490" y1="660" x2="490" y2="804" />
      <line x1="534" y1="660" x2="534" y2="804" />
    </g>
    <circle cx="556" cy="752" r="9" fill="#ffd45a" stroke-width="6" />
  </g>
  <g id="hill" stroke="#1c140e" stroke-width="16" stroke-linejoin="round">
    <path d="M-20 842 C 160 780, 330 800, 512 798 C 694 796, 864 780, 1044 842 V1044 H-20 Z" fill="url(#hill)" />
    <path d="M90 900 q30 -18 60 0 M820 920 q30 -18 60 0 M300 950 q26 -16 52 0" fill="none" stroke="#2f6e2c" stroke-width="10" stroke-linecap="round" />
  </g>
</svg>
